name: Update playlist

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links and update
        run: python update_playlist.py --input base.m3u --sources sources.txt --output playlist.m3u
      - name: Save changes
        run: |
          git config user.name "playlist-bot"
          git config user.email "playlist-bot@users.noreply.github.com"
          git add playlist.m3u report.md state.json
          git diff --cached --quiet || git commit -m "Daily update"
          git push
